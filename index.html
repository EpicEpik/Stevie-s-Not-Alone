<!DOCTYPE html>
<html>
<head>
    <title>Stevie's Not Alone</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* GAME AREA */
        #game {
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #3b2a1a 0%, #000 70%);
            position: relative;
        }

        /* TITLE + BEDROOM SCREENS */
        #title-screen, #bedroom {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            padding-top: 10%;
        }

        /* BIG PLAY BUTTON */
        #play-btn {
            padding: 20px 40px;
            font-size: 28px;
            margin-top: 20px;
            cursor: pointer;
        }

        /* HAND BUTTONS */
        #hand-options {
            margin: 20px;
        }

        .hand {
            padding: 12px 25px;
            margin: 5px;
            font-size: 20px;
            cursor: pointer;
        }

        .hint {
            opacity: 0.6;
            font-size: 14px;
        }

        /* HAND ANIMATION */
        #hand-anim {
            display: none;
            position: absolute;
            bottom: -200px;
            right: 20px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            transition: bottom 0.4s ease;
        }

        .hand-up {
            bottom: 20px;
        }

        /* DEMON EYES (FAKE 3D BY SCALE + BLUR) */
        #eyes {
            display: none;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 80px;
            color: red;
            letter-spacing: 40px;
            opacity: 0;
            filter: blur(2px);
            transition: opacity 0.5s ease, transform 0.5s ease, filter 0.5s ease;
        }

        .eyes-close {
            transform: translateX(-50%) scale(1.3);
            filter: blur(0px);
        }

        .tilt {
            transform: translateX(-50%) scale(1.3) rotate(20deg);
        }

        /* SCREEN SHAKE */
        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(10px, -10px); }
            50% { transform: translate(-10px, 10px); }
            75% { transform: translate(10px, 10px); }
            100% { transform: translate(0, 0); }
        }
    </style>
</head>
<body>

    <div id="game">
        <!-- TITLE SCREEN -->
        <div id="title-screen">
            <h1>Stevie's Not Alone</h1>

            <p>Select your hand:</p>
            <div id="hand-options">
                <button class="hand" data-hand="black">Black Hand</button>
                <button class="hand" data-hand="tan">Tan Hand</button>
                <button class="hand" data-hand="white">White Hand</button>
            </div>

            <button id="play-btn" style="display:none;">Play</button>
        </div>

        <!-- BEDROOM SCENE -->
        <div id="bedroom" style="display:none;">
            <p id="dialogue"></p>
            <p id="hint" class="hint">Press E to toggle the light switch.</p>
        </div>

        <!-- HAND ANIMATION -->
        <div id="hand-anim"></div>

        <!-- DEMON EYES -->
        <div id="eyes">● ●</div>
    </div>

    <script>
        let chosenHand = null;
        let inBedroom = false;
        let lightTried = false;

        // HAND SELECTION
        document.querySelectorAll(".hand").forEach(btn => {
            btn.addEventListener("click", () => {
                chosenHand = btn.dataset.hand;

                const hand = document.getElementById("hand-anim");
                if (chosenHand === "black") hand.style.background = "#3b2f2f";
                if (chosenHand === "tan") hand.style.background = "#d2a679";
                if (chosenHand === "white") hand.style.background = "#f2d6c9";

                document.getElementById("play-btn").style.display = "block";
            });
        });

        // START GAME
        document.getElementById("play-btn").addEventListener("click", () => {
            document.getElementById("title-screen").style.display = "none";
            document.getElementById("bedroom").style.display = "block";
            inBedroom = true;

            document.getElementById("dialogue").innerText =
                "STEVIE: Mother? Father? I had a nightmare...";
        });

        // LIGHT SWITCH EVENT
        document.addEventListener("keydown", (e) => {
            if (!inBedroom) return;

            if (e.key === "e" || e.key === "E") {
                const hand = document.getElementById("hand-anim");
                hand.style.display = "block";
                hand.classList.add("hand-up");

                setTimeout(() => {
                    hand.classList.remove("hand-up");
                }, 400);

                if (!lightTried) {
                    lightTried = true;

                    document.getElementById("dialogue").innerText =
                        "STEVIE: Oh, the power's out again. I could fix the generators... Or just go back to sleep.";

                    document.getElementById("hint").style.display = "none";

                    showChoices();
                }
            }
        });

        // CHOICE BUTTONS
        function showChoices() {
            const choice1 = document.createElement("button");
            const choice2 = document.createElement("button");

            choice1.innerText = "Fix generators";
            choice2.innerText = "Go back to sleep";

            choice1.style.margin = "10px";
            choice2.style.margin = "10px";

            choice1.onclick = () => alert("Generator path coming soon!");
            choice2.onclick = () => jumpscare();

            document.getElementById("bedroom").appendChild(choice1);
            document.getElementById("bedroom").appendChild(choice2);
        }

        // DEMON JUMPSCARE
        function jumpscare() {
            const eyes = document.getElementById("eyes");

            eyes.style.display = "block";
            eyes.style.opacity = "1";
            eyes.classList.add("eyes-close");

            document.body.classList.add("shake");

            setTimeout(() => {
                eyes.classList.add("tilt");
            }, 500);

            setTimeout(() => {
                document.body.style.backgroundColor = "black";
                document.getElementById("bedroom").style.display = "none";
            }, 1500);
        }
    </script>

</body>
</html>
