<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stevie's Not Alone: Demo</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
      height: 100%;
    }

    #container {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
    }

    /* MAIN MENU */

    #main-menu {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, #222 0%, #000 60%, #000 100%),
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,0.03) 0px,
          rgba(255,255,255,0.03) 1px,
          rgba(0,0,0,0.03) 2px,
          rgba(0,0,0,0.03) 3px
        );
      color: #fff;
    }

    .menu-title {
      font-size: 2.4rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .menu-options {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      font-size: 1rem;
    }

    .menu-option {
      cursor: pointer;
      color: #ccc;
    }

    .menu-option:hover {
      color: #fff;
    }

    .menu-option.active {
      color: #fff;
    }

    .menu-option.active::before {
      content: ">> ";
      color: #fff;
    }

    .menu-hint {
      margin-top: 2rem;
      font-size: 0.8rem;
      opacity: 0.7;
      text-align: center;
    }

    /* SETTINGS */

    #settings-menu {
      position: fixed;
      inset: 0;
      z-index: 11;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.9);
      color: #fff;
    }

    .settings-panel {
      background: #111;
      border: 1px solid #444;
      padding: 1.5rem 2rem;
      border-radius: 8px;
      min-width: 260px;
    }

    .settings-title {
      font-size: 1.4rem;
      margin-bottom: 1rem;
      text-align: center;
    }

    .settings-row {
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }

    .settings-row label {
      display: block;
      margin-bottom: 0.3rem;
    }

    .settings-row input[type="range"] {
      width: 100%;
    }

    .settings-buttons {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
    }

    .settings-button {
      padding: 0.4rem 1.2rem;
      border-radius: 999px;
      border: 1px solid #ffffff55;
      background: #ffffff10;
      color: #fff;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .settings-button:hover {
      background: #ffffff25;
    }

    /* OBJECTIVES */

    #objective-panel {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 9;
      background: #f5f1e6;
      border: 1px solid #c3b9a0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      padding: 0.8rem 1rem;
      border-radius: 6px;
      max-width: 260px;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    #objective-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #7a6a4a;
      margin-bottom: 0.4rem;
    }

    #objective-text {
      font-size: 0.9rem;
      color: #3b2f1a;
      line-height: 1.3;
    }

    /* DIALOGUE BAR */

    #dialogue-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 9;
      background: rgba(0,0,0,0.8);
      border-top: 1px solid #444;
      padding: 0.6rem 1rem;
      display: none;
      color: #fff;
    }

    #dialogue-speaker {
      font-weight: 600;
      margin-right: 0.5rem;
    }

    #dialogue-text {
      font-weight: 400;
    }
  </style>
</head>

<body>
  <div id="container"></div>

  <!-- MAIN MENU -->
  <div id="main-menu">
    <div class="menu-title">STEVIE'S NOT ALONE</div>
    <div class="menu-options">
      <div id="menu-new" class="menu-option active">New Game</div>
      <div id="menu-continue" class="menu-option">Continue</div>
      <div id="menu-settings" class="menu-option">Settings</div>
      <div id="menu-quit" class="menu-option">Quit</div>
    </div>
    <div class="menu-hint">
      WASD move · Arrows look · E interact · F lock bathroom · Shift sprint · Ctrl crouch
    </div>
  </div>

  <!-- SETTINGS MENU -->
  <div id="settings-menu">
    <div class="settings-panel">
      <div class="settings-title">Settings</div>

      <div class="settings-row">
        <label for="master-volume">Master Volume</label>
        <input id="master-volume" type="range" min="0" max="100" value="80">
      </div>

      <div class="settings-row">
        <label for="jumpscare-volume">Jumpscare Volume</label>
        <input id="jumpscare-volume" type="range" min="0" max="100" value="60">
      </div>

      <div class="settings-buttons">
        <button id="settings-back" class="settings-button">Back</button>
      </div>
    </div>
  </div>

  <!-- OBJECTIVES -->
  <div id="objective-panel">
    <div id="objective-title">Objective</div>
    <div id="objective-text">Leave your room.</div>
  </div>

  <!-- DIALOGUE BAR -->
  <div id="dialogue-bar">
    <span id="dialogue-speaker"></span>
    <span id="dialogue-text"></span>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
    const container = document.getElementById('container');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x000000);
    container.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(
      60,
      container.clientWidth / container.clientHeight,
      0.1,
      100
    );

    let scene;
    let currentSceneName = "bedroom";

    let yaw = 0;
    let turningLeft = false;
    let turningRight = false;
    let inFirstPerson = false;

    let moveForward = false;
    let moveBackward = false;
    let moveLeft = false;
    let moveRight = false;
    let sprinting = false;
    let crouching = false;

    let baseSpeed = 0.06;
    let speed = baseSpeed;

    let hasBathroomKey = false;
    let bathroomLocked = false;
    let demonTriggered = false;

    let masterVolume = 0.8;
    let jumpscareVolume = 0.6;

    let bedroomDoor, hallwayDoorBathroom, hallwayDoorParents, hallwayDoorKitchen, hallwayDoorStevie;
    let bathroomDoorBack, kitchenDoorBack;
    let keyMesh;

    let bedroomScene, hallwayScene, kitchenScene, bathroomScene;

    const objectiveText = document.getElementById('objective-text');
    const dialogueBar = document.getElementById('dialogue-bar');
    const dialogueSpeaker = document.getElementById('dialogue-speaker');
    const dialogueText = document.getElementById('dialogue-text');
    let dialogueTimeout = null;

    function setObjective(text) {
      objectiveText.textContent = text;
    }

    function showDialogue(speaker, text, duration = 3000) {
      dialogueSpeaker.textContent = speaker + ": ";
      dialogueText.textContent = text;
      dialogueBar.style.display = 'block';
      if (dialogueTimeout) clearTimeout(dialogueTimeout);
      dialogueTimeout = setTimeout(() => {
        dialogueBar.style.display = 'none';
      }, duration);
    }

    function showTutorial() {
      showDialogue(
        "TUTORIAL",
        "WASD move · Arrows look · E doors/objects · F lock bathroom · Shift sprint · Ctrl crouch.",
        7000
      );
    }

    // INPUT
    window.addEventListener('keydown', (e) => {
      if (!inFirstPerson) return;

      if (e.key === 'ArrowLeft') turningLeft = true;
      if (e.key === 'ArrowRight') turningRight = true;

      if (e.key === 'w') moveForward = true;
      if (e.key === 's') moveBackward = true;
      if (e.key === 'a') moveLeft = true;
      if (e.key === 'd') moveRight = true;

      if (e.key === 'Shift') sprinting = true;
      if (e.key === 'Control') crouching = true;

      if (e.key === 'e') interact();
      if (e.key === 'f') tryLockBathroom();
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft') turningLeft = false;
      if (e.key === 'ArrowRight') turningRight = false;

      if (e.key === 'w') moveForward = false;
      if (e.key === 's') moveBackward = false;
      if (e.key === 'a') moveLeft = false;
      if (e.key === 'd') moveRight = false;

      if (e.key === 'Shift') sprinting = false;
      if (e.key === 'Control') crouching = false;
    });

    function updateCameraLook() {
      if (!inFirstPerson) return;
      const speedLook = 0.03;
      if (turningLeft) yaw += speedLook;
      if (turningRight) yaw -= speedLook;
      const dirX = Math.sin(yaw);
      const dirZ = Math.cos(yaw);
      camera.lookAt(
        camera.position.x + dirX,
        camera.position.y,
        camera.position.z + dirZ
      );
    }

    function clampPositionByScene(pos) {
      if (currentSceneName === "bedroom") {
        pos.x = Math.max(-4.5, Math.min(4.5, pos.x));
        pos.z = Math.max(-4.5, Math.min(4.5, pos.z));
      }
      if (currentSceneName === "hallway") {
        pos.x = Math.max(-1.8, Math.min(1.8, pos.x));
        pos.z = Math.max(-3.2, Math.min(3.2, pos.z));
      }
      if (currentSceneName === "kitchen") {
        pos.x = Math.max(-4.5, Math.min(4.5, pos.x));
        pos.z = Math.max(-4.5, Math.min(4.5, pos.z));
      }
      if (currentSceneName === "bathroom") {
        pos.x = Math.max(-4.5, Math.min(4.5, pos.x));
        pos.z = Math.max(-4.5, Math.min(4.5, pos.z));
      }
    }

    function updateMovement() {
      if (!inFirstPerson) return;

      speed = baseSpeed;
      if (sprinting && !crouching) speed = baseSpeed * 1.8;
      if (crouching) speed = baseSpeed * 0.5;

      const dir = new THREE.Vector3();
      camera.getWorldDirection(dir);
      const right = new THREE.Vector3();
      right.crossVectors(dir, camera.up);

      const newPos = camera.position.clone();

      if (moveForward) newPos.addScaledVector(dir, speed);
      if (moveBackward) newPos.addScaledVector(dir, -speed);
      if (moveLeft) newPos.addScaledVector(right, -speed);
      if (moveRight) newPos.addScaledVector(right, speed);

      clampPositionByScene(newPos);
      camera.position.copy(newPos);

      camera.position.y = crouching ? 1.2 : 1.4; // shorter + crouch
    }

    // TEXTURE HELPERS
    function makeTextTexture(text) {
      const canvas = document.createElement("canvas");
      canvas.width = 512;
      canvas.height = 256;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#f5f1e6";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#000";
      ctx.font = "48px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      return texture;
    }

    // DOOR + PLAQUE
    function makeWoodDoor() {
      const door = new THREE.Group();
      const slab = new THREE.Mesh(
        new THREE.BoxGeometry(1, 2, 0.1),
        new THREE.MeshStandardMaterial({
          color: 0x7a5a3a,
          roughness: 0.4,
          metalness: 0.1
        })
      );
      door.add(slab);

      const panelMat = new THREE.MeshStandardMaterial({
        color: 0x5a3a1e,
        roughness: 0.5
      });

      function addPanel(x, y, w, h) {
        const panel = new THREE.Mesh(
          new THREE.BoxGeometry(w, h, 0.05),
          panelMat
        );
        panel.position.set(x, y, 0.03);
        door.add(panel);
      }

      addPanel(0, 1.0, 0.7, 0.5);
      addPanel(0, 0.3, 0.7, 0.5);
      addPanel(0, -0.4, 0.7, 0.5);
      addPanel(0, -1.1, 0.7, 0.5);

      const handle = new THREE.Mesh(
        new THREE.CylinderGeometry(0.05, 0.05, 0.3, 16),
        new THREE.MeshStandardMaterial({
          color: 0xd4af37,
          metalness: 0.8,
          roughness: 0.2
        })
      );
      handle.rotation.z = Math.PI / 2;
      handle.position.set(0.45, 0.0, 0.08);
      door.add(handle);

      return door;
    }

    function makePlaque(text) {
      const plaqueGroup = new THREE.Group();

      const plaque = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, 0.45, 0.05),
        new THREE.MeshStandardMaterial({
          color: 0x7a4a2a,
          roughness: 0.5,
          metalness: 0.1
        })
      );
      plaque.position.set(0, 0, 0.06);
      plaqueGroup.add(plaque);

      const dowel = new THREE.Mesh(
        new THREE.CylinderGeometry(0.02, 0.02, 0.95, 12),
        new THREE.MeshStandardMaterial({
          color: 0x8b5a2b,
          roughness: 0.5
        })
      );
      dowel.rotation.z = Math.PI / 2;
      dowel.position.set(0, 0.3, 0.04);
      plaqueGroup.add(dowel);

      const ropeMat = new THREE.MeshStandardMaterial({ color: 0xdddddd });
      const ropeLeft = new THREE.Mesh(
        new THREE.CylinderGeometry(0.01, 0.01, 0.25, 8),
        ropeMat
      );
      ropeLeft.rotation.z = Math.PI / 2;
      ropeLeft.position.set(-0.25, 0.45, 0.02);
      plaqueGroup.add(ropeLeft);

      const ropeRight = ropeLeft.clone();
      ropeRight.position.x = 0.25;
      plaqueGroup.add(ropeRight);

      const textPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(0.85, 0.4),
        new THREE.MeshBasicMaterial({
          map: makeTextTexture(text)
        })
      );
      textPlane.position.set(0, 0, 0.08);
      plaqueGroup.add(textPlane);

      return plaqueGroup;
    }

    function addDoorPlaques() {
      if (bedroomDoor && !bedroomDoor._hasPlaque) {
        const steviePlaque = makePlaque("Stevie's Room! :D");
        steviePlaque.position.set(0, 0.6, 0.09);
        bedroomDoor.add(steviePlaque);
        bedroomDoor._hasPlaque = true;
      }

      if (hallwayDoorBathroom && !hallwayDoorBathroom._hasPlaque) {
        const bathPlaque = makePlaque("Bathroom");
        bathPlaque.position.set(0, 0.6, 0.09);
        hallwayDoorBathroom.add(bathPlaque);
        hallwayDoorBathroom._hasPlaque = true;
      }

      if (hallwayDoorParents && !hallwayDoorParents._hasPlaque) {
        const parentsPlaque = makePlaque("MARY AND ROBERT");
        parentsPlaque.position.set(0, 0.6, 0.09);
        hallwayDoorParents.add(parentsPlaque);
        hallwayDoorParents._hasPlaque = true;
      }

      if (hallwayDoorStevie && !hallwayDoorStevie._hasPlaque) {
        const stevieHallPlaque = makePlaque("Stevie");
        stevieHallPlaque.position.set(0, 0.6, 0.09);
        hallwayDoorStevie.add(stevieHallPlaque);
        hallwayDoorStevie._hasPlaque = true;
      }
    }

    // SCENES
    function createBedroom() {
      const s = new THREE.Scene();
      s.background = new THREE.Color(0x101018);

      const ambient = new THREE.AmbientLight(0xffffff, 0.7);
      s.add(ambient);

      const mainLight = new THREE.PointLight(0x9fbfff, 1.8, 20);
      mainLight.position.set(-2, 3, 2);
      s.add(mainLight);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(10, 10),
        new THREE.MeshStandardMaterial({ color: 0x505050 })
      );
      floor.rotation.x = -Math.PI / 2;
      s.add(floor);

      const wallMat = new THREE.MeshStandardMaterial({ color: 0x404050 });
      const wallGeo = new THREE.PlaneGeometry(10, 5);

      const backWall = new THREE.Mesh(wallGeo, wallMat);
      backWall.position.set(0, 2.5, -5);
      s.add(backWall);

      const leftWall = new THREE.Mesh(wallGeo, wallMat);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-5, 2.5, 0);
      s.add(leftWall);

      const rightWall = new THREE.Mesh(wallGeo, wallMat);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(5, 2.5, 0);
      s.add(rightWall);

      bedroomDoor = makeWoodDoor();
      bedroomDoor.position.set(5, 1, -1);
      bedroomDoor.rotation.y = -Math.PI / 2;
      s.add(bedroomDoor);

      return s;
    }

    let demon, demonState = "asleepParents";

    function createHallway() {
      const s = new THREE.Scene();
      s.background = new THREE.Color(0x080808);

      const ambient = new THREE.AmbientLight(0xffffff, 0.8);
      s.add(ambient);

      const mainLight = new THREE.PointLight(0xffffff, 2.2, 25);
      mainLight.position.set(0, 3, 0);
      s.add(mainLight);

      const fillLight = new THREE.PointLight(0xffffff, 1.4, 18);
      fillLight.position.set(2, 2, -2);
      s.add(fillLight);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(20, 4),
        new THREE.MeshStandardMaterial({ color: 0x505050 })
      );
      floor.rotation.x = -Math.PI / 2;
      s.add(floor);

      const wallMat = new THREE.MeshStandardMaterial({ color: 0x404040 });
      const wallGeo = new THREE.PlaneGeometry(20, 5);

      const leftWall = new THREE.Mesh(wallGeo, wallMat);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-2, 2.5, 0);
      s.add(leftWall);

      const rightWall = new THREE.Mesh(wallGeo, wallMat);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(2, 2.5, 0);
      s.add(rightWall);

      hallwayDoorBathroom = makeWoodDoor();
      hallwayDoorBathroom.position.set(-2, 1, -2);
      hallwayDoorBathroom.rotation.y = Math.PI / 2;
      s.add(hallwayDoorBathroom);

      hallwayDoorParents = makeWoodDoor();
      hallwayDoorParents.position.set(2, 1, -2);
      hallwayDoorParents.rotation.y = -Math.PI / 2;
      s.add(hallwayDoorParents);

      hallwayDoorKitchen = makeWoodDoor();
      hallwayDoorKitchen.position.set(0, 1, 2);
      hallwayDoorKitchen.rotation.y = Math.PI;
      s.add(hallwayDoorKitchen);

      hallwayDoorStevie = makeWoodDoor();
      hallwayDoorStevie.position.set(0, 1, -2.8);
      hallwayDoorStevie.rotation.y = 0;
      s.add(hallwayDoorStevie);

      // DEMON: shadow body + red mask
      const bodyMat = new THREE.MeshStandardMaterial({
        color: 0x050505,
        emissive: new THREE.Color(0x111111),
        roughness: 0.9
      });
      demon = new THREE.Group();

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.7, 2.6, 0.4),
        bodyMat
      );
      body.position.y = 1.5;
      demon.add(body);

      const headMat = new THREE.MeshStandardMaterial({
        color: 0xff0000,
        emissive: new THREE.Color(0xff0000),
        emissiveIntensity: 1.2,
        roughness: 0.4
      });
      const head = new THREE.Mesh(
        new THREE.BoxGeometry(0.7, 0.9, 0.3),
        headMat
      );
      head.position.y = 2.4;
      demon.add(head);

      const eyeMat = new THREE.MeshStandardMaterial({
        color: 0x000000,
        emissive: new THREE.Color(0x000000),
        roughness: 0.9
      });
      const eyeL = new THREE.Mesh(
        new THREE.BoxGeometry(0.18, 0.18, 0.02),
        eyeMat
      );
      eyeL.position.set(-0.18, 2.5, 0.16);
      demon.add(eyeL);
      const eyeR = eyeL.clone();
      eyeR.position.x = 0.18;
      demon.add(eyeR);

      const teethMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        emissive: new THREE.Color(0xffffff),
        emissiveIntensity: 0.6,
        roughness: 0.3
      });
      const teeth = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 0.12, 0.02),
        teethMat
      );
      teeth.position.set(0, 2.25, 0.16);
      demon.add(teeth);

      const rim = new THREE.PointLight(0xff0000, 0.6, 4);
      rim.position.set(0, 2.4, 0.6);
      demon.add(rim);

      demon.position.set(2, 0, -2.5); // behind parents door
      s.add(demon);

      demonState = "asleepParents";

      return s;
    }

    function createKitchen() {
      const s = new THREE.Scene();
      s.background = new THREE.Color(0x101010);

      const ambient = new THREE.AmbientLight(0xffffff, 0.8);
      s.add(ambient);

      const lamp = new THREE.PointLight(0xfff2cc, 2.0, 20);
      lamp.position.set(0, 3, 0);
      s.add(lamp);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(10, 10),
        new THREE.MeshStandardMaterial({ color: 0x606050 })
      );
      floor.rotation.x = -Math.PI / 2;
      s.add(floor);

      const wallGeo = new THREE.PlaneGeometry(10, 5);
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x505050 });

      const backWall = new THREE.Mesh(wallGeo, wallMat);
      backWall.position.set(0, 2.5, -5);
      s.add(backWall);

      const leftWall = new THREE.Mesh(wallGeo, wallMat);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-5, 2.5, 0);
      s.add(leftWall);

      const rightWall = new THREE.Mesh(wallGeo, wallMat);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(5, 2.5, 0);
      s.add(rightWall);

      kitchenDoorBack = makeWoodDoor();
      kitchenDoorBack.position.set(0, 1, 5);
      kitchenDoorBack.rotation.y = Math.PI;
      s.add(kitchenDoorBack);

      const keyGroup = new THREE.Group();
      const keyHead = new THREE.Mesh(
        new THREE.TorusGeometry(0.15, 0.05, 16, 32),
        new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.2 })
      );
      keyGroup.add(keyHead);
      const keyShaft = new THREE.Mesh(
        new THREE.BoxGeometry(0.4, 0.08, 0.08),
        new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.2 })
      );
      keyShaft.position.set(0.3, 0, 0);
      keyGroup.add(keyShaft);
      const keyTeeth = new THREE.Mesh(
        new THREE.BoxGeometry(0.15, 0.08, 0.08),
        new THREE.MeshStandardMaterial({ color: 0xffd700, metalness: 0.9, roughness: 0.2 })
      );
      keyTeeth.position.set(0.55, -0.1, 0);
      keyGroup.add(keyTeeth);

      keyGroup.children.forEach(part => {
        part.material.emissive = new THREE.Color(0xffd700);
        part.material.emissiveIntensity = 0.4;
      });

      keyGroup.position.set(1.5, 1, -1.5);
      s.add(keyGroup);
      keyMesh = keyGroup;

      const keyLight = new THREE.PointLight(0xfff2aa, 1.2, 4);
      keyLight.position.set(1.5, 1.3, -1.5);
      s.add(keyLight);

      return s;
    }

    function createBathroom() {
      const s = new THREE.Scene();
      s.background = new THREE.Color(0x202840);

      const ambient = new THREE.AmbientLight(0xffffff, 0.8);
      s.add(ambient);

      const lamp = new THREE.PointLight(0xb0c4ff, 2.0, 18);
      lamp.position.set(0, 3, 0);
      s.add(lamp);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(10, 10),
        new THREE.MeshStandardMaterial({ color: 0x303860 })
      );
      floor.rotation.x = -Math.PI / 2;
      s.add(floor);

      const wallGeo = new THREE.PlaneGeometry(10, 5);
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x303860 });

      const backWall = new THREE.Mesh(wallGeo, wallMat);
      backWall.position.set(0, 2.5, -5);
      s.add(backWall);

      const leftWall = new THREE.Mesh(wallGeo, wallMat);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-5, 2.5, 0);
      s.add(leftWall);

      const rightWall = new THREE.Mesh(wallGeo, wallMat);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(5, 2.5, 0);
      s.add(rightWall);

      bathroomDoorBack = makeWoodDoor();
      bathroomDoorBack.position.set(0, 1, 5);
      bathroomDoorBack.rotation.y = Math.PI;
      s.add(bathroomDoorBack);

      return s;
    }

    // SCENE SWITCHING
    function switchTo(sceneName) {
      currentSceneName = sceneName;

      if (sceneName === "bedroom") scene = bedroomScene;
      if (sceneName === "hallway") scene = hallwayScene;
      if (sceneName === "kitchen") scene = kitchenScene;
      if (sceneName === "bathroom") scene = bathroomScene;

      camera.position.set(0, 1.4, 0);
      yaw = 0;
      updateCameraLook();
    }

    // LOCK BATHROOM
    function tryLockBathroom() {
      if (currentSceneName === "hallway") {
        if (camera.position.distanceTo(hallwayDoorBathroom.position) < 2) {
          if (!demonTriggered) {
            showDialogue("STEVIE", "Why would I lock it now?");
            return;
          }
          bathroomLocked = true;
          showDialogue("STEVIE", "Locked. He can't get in now...");
        }
      }
    }

    // INTERACTION
    function interact() {
      if (currentSceneName === "bedroom") {
        if (camera.position.distanceTo(bedroomDoor.position) < 2) {
          switchTo("hallway");
          // spawn facing bedroom door
          camera.position.set(1.5, 1.4, -1);
          yaw = Math.PI / 2; // look towards +x (bedroom door)
          updateCameraLook();
          setObjective("Find the bathroom key in the kitchen.");
        }
      }

      if (currentSceneName === "hallway") {
        if (camera.position.distanceTo(hallwayDoorBathroom.position) < 2) {
          if (!hasBathroomKey) {
            showDialogue("STEVIE", "It's locked... I think the key is in the kitchen.");
            setObjective("Go to the kitchen and find the bathroom key.");
            return;
          } else if (!bathroomLocked) {
            // enter bathroom: THIS triggers demon
            switchTo("bathroom");
            camera.position.set(0, 1.4, 3.5);
            yaw = Math.PI;
            updateCameraLook();
            setObjective("Use the bathroom... something feels wrong.");
            if (!demonTriggered) {
              demonTriggered = true;
              demonState = "breakingOut";
              showDialogue("???", "*THUD from the parents' room...*", 4000);
            }
            return;
          } else {
            showDialogue("STEVIE", "I locked it. He can't get in.");
            return;
          }
        }

        if (camera.position.distanceTo(hallwayDoorParents.position) < 2) {
          showDialogue("STEVIE", "Mother and Father are asleep... I shouldn't go in.");
          return;
        }

        if (camera.position.distanceTo(hallwayDoorKitchen.position) < 2) {
          switchTo("kitchen");
          camera.position.set(0, 1.4, -3.5);
          yaw = 0;
          updateCameraLook();
          setObjective("Search the kitchen for the bathroom key.");
          return;
        }

        if (camera.position.distanceTo(hallwayDoorStevie.position) < 2) {
          if (demonState === "inKitchen") {
            switchTo("bedroom");
            camera.position.set(0, 1.4, 3.5);
            yaw = 0;
            updateCameraLook();
            setObjective("You made it back to your room.");
            showDialogue("STEVIE", "Locked the door... I think I'm safe. For now.", 5000);
          } else {
            showDialogue("STEVIE", "I shouldn't hide yet. He'll see me.");
          }
          return;
        }
      }

      if (currentSceneName === "kitchen") {
        if (camera.position.distanceTo(kitchenDoorBack.position) < 2) {
          switchTo("hallway");
          camera.position.set(0, 1.4, 1.5);
          yaw = Math.PI;
          updateCameraLook();
          setObjective("Go back to the bathroom.");
          return;
        }

        if (!hasBathroomKey && camera.position.distanceTo(keyMesh.position) < 1.2) {
          hasBathroomKey = true;
          keyMesh.visible = false;
          showDialogue("STEVIE", "Got it. Bathroom key. Finally.");
          setObjective("Unlock the bathroom door and go inside.");
          return;
        }
      }

      if (currentSceneName === "bathroom") {
        if (camera.position.distanceTo(bathroomDoorBack.position) < 2) {
          switchTo("hallway");
          camera.position.set(-0.5, 1.4, -1.5);
          yaw = 0;
          updateCameraLook();
          setObjective("Lock the bathroom door (F) and watch him.");
          return;
        }
      }
    }

    // DEMON AI
    function moveDemonTowards(target, speed) {
      const dir = new THREE.Vector3().subVectors(target, demon.position);
      const dist = dir.length();
      if (dist < 0.001) return;
      dir.normalize();
      demon.position.addScaledVector(dir, speed);
    }

    function updateDemon(delta) {
      if (!demon || currentSceneName !== "hallway") return;

      if (demonState === "breakingOut") {
        hallwayDoorParents.rotation.y -= 0.02;
        if (hallwayDoorParents.rotation.y < -Math.PI / 2 - 0.5) {
          demonState = "stalkingHallway";
          showDialogue("STEVIE", "He's out... I need to lock the bathroom.", 4000);
          setObjective("Lock the bathroom door (F) before he reaches it.");
        }
      }

      if (demonState === "stalkingHallway") {
        const target = new THREE.Vector3(-2, 0, -2); // bathroom door
        moveDemonTowards(target, 0.015);
        if (demon.position.distanceTo(target) < 0.25) {
          if (!bathroomLocked) {
            demonState = "gameOver";
            inFirstPerson = false;
            showDialogue("GAME", "He found you.", 5000);
          } else {
            demonState = "toKitchen";
            showDialogue("STEVIE", "He can't get in... he's turning around.", 4000);
            setObjective("Wait for him to go to the kitchen, then run to your room.");
          }
        }
      }

      if (demonState === "toKitchen") {
        const target = new THREE.Vector3(0, 0, 2); // kitchen door
        moveDemonTowards(target, 0.015);
        if (demon.position.distanceTo(target) < 0.25) {
          demonState = "inKitchen";
          showDialogue("STEVIE", "He's going into the kitchen... I need to run to my room.", 5000);
          setObjective("Sprint to your hallway door and get back to your room.");
        }
      }

      if (demonState === "gameOver") {
        // freeze
        inFirstPerson = false;
      }
    }

    // ANIMATION LOOP
    function animate() {
      requestAnimationFrame(animate);
      const delta = 0.016;
      updateCameraLook();
      updateMovement();
      updateDemon(delta);
      renderer.render(scene, camera);
    }

    // INIT
    bedroomScene = createBedroom();
    hallwayScene = createHallway();
    kitchenScene = createKitchen();
    bathroomScene = createBathroom();

    scene = bedroomScene;

    camera.position.set(0, 1.4, 3.5);
    yaw = 0;
    updateCameraLook();

    animate();

    // MENU LOGIC
    const mainMenu = document.getElementById('main-menu');
    const settingsMenu = document.getElementById('settings-menu');

    const menuNew = document.getElementById('menu-new');
    const menuContinue = document.getElementById('menu-continue');
    const menuSettings = document.getElementById('menu-settings');
    const menuQuit = document.getElementById('menu-quit');

    const masterSlider = document.getElementById('master-volume');
    const jumpscareSlider = document.getElementById('jumpscare-volume');
    const settingsBack = document.getElementById('settings-back');

    function resetGameState() {
      hasBathroomKey = false;
      bathroomLocked = false;
      demonTriggered = false;
      if (keyMesh) keyMesh.visible = true;
      demonState = "asleepParents";
      hallwayDoorParents.rotation.y = -Math.PI / 2;
      setObjective("Leave your room.");
    }

    function startGameNew() {
      mainMenu.style.display = 'none';
      settingsMenu.style.display = 'none';
      inFirstPerson = true;
      resetGameState();
      switchTo("bedroom");
      camera.position.set(0, 1.4, 3.5);
      yaw = 0;
      updateCameraLook();
      addDoorPlaques();
      showTutorial();
    }

    function startGameContinue() {
      mainMenu.style.display = 'none';
      settingsMenu.style.display = 'none';
      inFirstPerson = true;
      switchTo(currentSceneName || "bedroom");
      addDoorPlaques();
    }

    menuNew.addEventListener('click', startGameNew);
    menuContinue.addEventListener('click', startGameContinue);

    menuSettings.addEventListener('click', () => {
      settingsMenu.style.display = 'flex';
    });

    menuQuit.addEventListener('click', () => {
      alert("You can't actually quit from here yet, but nice try.");
    });

    settingsBack.addEventListener('click', () => {
      settingsMenu.style.display = 'none';
    });

    masterSlider.addEventListener('input', () => {
      masterVolume = masterSlider.value / 100;
    });

    jumpscareSlider.addEventListener('input', () => {
      jumpscareVolume = jumpscareSlider.value / 100;
    });

    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    });
  </script>
</body>
</html>
