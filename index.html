<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stevie's Not Alone: Demo</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
      color: #fff;
    }

    #ui {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .hidden {
      opacity: 0;
      pointer-events: none;
    }

    .visible {
      opacity: 1;
      pointer-events: auto;
    }

    .title {
      font-size: 3rem;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
      text-align: center;
    }

    .subtitle {
      opacity: 0.7;
      margin-bottom: 2rem;
      text-align: center;
    }

    .play-btn {
      padding: 0.8rem 2.5rem;
      font-size: 1rem;
      letter-spacing: 0.1em;
      border-radius: 999px;
      border: 1px solid #ffffff55;
      background: #ffffff10;
      color: #fff;
      cursor: pointer;
      pointer-events: auto;
      transition: background 0.2s;
    }

    .play-btn:hover {
      background: #ffffff25;
    }

    canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>

<body>
  <div id="ui" class="visible">
    <div class="title">STEVIE'S NOT ALONE: DEMO</div>
    <div class="subtitle">Press PLAY to begin.</div>
    <button id="play" class="play-btn">PLAY</button>
  </div>

  <script>
    let scene, camera, renderer;
    let stevie;

    const STEVIE_SKIN = 0xf8e6da; // ghostly pale

    function init() {
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(
        50,
        window.innerWidth / window.innerHeight,
        0.1,
        100
      );
      camera.position.set(0, 1.6, 4);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(2, 4, 3);
      scene.add(light);

      const ambient = new THREE.AmbientLight(0xffffff, 0.3);
      scene.add(ambient);

      stevie = buildStevie();
      stevie.position.set(0, 0, 0);
      scene.add(stevie);

      animate();
    }

    function buildStevie() {
      const g = new THREE.Group();
      const skin = new THREE.MeshStandardMaterial({ color: STEVIE_SKIN });

      const head = new THREE.Mesh(new THREE.SphereGeometry(0.3), skin);
      head.position.set(0, 1.8, 0);
      g.add(head);

      const body = new THREE.Mesh(
        new THREE.BoxGeometry(0.6, 1, 0.3),
        new THREE.MeshStandardMaterial({ color: 0x333333 })
      );
      body.position.set(0, 1, 0);
      g.add(body);

      return g;
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    document.getElementById("play").onclick = () => {
      document.getElementById("ui").classList.add("hidden");

      // Move camera for game scene
      camera.position.set(0, 1.6, 2.5);
    };

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init();
  </script>
</body>
</html>
