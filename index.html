<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Pointer Lock Test</title>
<style>
  body { margin: 0; overflow: hidden; background: #000; color: #fff; }
  #overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
  }
  #playButton {
    font-size: 40px;
    padding: 25px 50px;
    border: none;
    border-radius: 12px;
    background: #ffffff;
    color: #000;
    cursor: pointer;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<div id="overlay">
  <button id="playButton">PLAY</button>
  <p>Click PLAY to lock mouse.</p>
</div>

<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.158.0/examples/js/controls/PointerLockControls.js"></script>

<script>
let camera, scene, renderer, controls;

scene = new THREE.Scene();
camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
renderer = new THREE.WebGLRenderer();
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

controls = new THREE.PointerLockControls(camera, document.body);

document.getElementById("playButton").addEventListener("click", () => {
  controls.lock();
});

controls.addEventListener("lock", () => {
  document.getElementById("overlay").style.display = "none";
});

controls.addEventListener("unlock", () => {
  document.getElementById("overlay").style.display = "flex";
});

camera.position.z = 5;

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}
animate();
</script>

</body>
</html>
