<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Stevie's Not Alone</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: system-ui, sans-serif;
      height: 100%;
    }

    #container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 60px;
    }

    canvas {
      display: block;
    }

    #room-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: #000;
      border-top: 2px solid #400000;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.8);
      z-index: 10;
    }

    .room-button {
      background: #111;
      color: #ff3333;
      border: 2px solid #660000;
      padding: 8px 14px;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      border-radius: 4px;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.2);
      white-space: nowrap;
    }

    .room-button:hover {
      background: #220000;
      transform: translateY(-2px);
      box-shadow: 0 0 12px rgba(255, 0, 0, 0.5);
    }

    .room-button.active {
      background: #440000;
      color: #fff;
      box-shadow: 0 0 16px rgba(255, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <div id="container"></div>

  <div id="room-bar">
    <button class="room-button active" data-room="bedroom">Bedroom</button>
    <button class="room-button" data-room="hallway">Hallway</button>
    <button class="room-button" data-room="kitchen">Kitchen</button>
    <button class="room-button" data-room="bathroom">Bathroom</button>
    <button class="room-button" data-room="living">Living Room</button>
    <button class="room-button" data-room="basement">Basement</button>
    <button class="room-button" data-room="attic">Attic</button>
    <button class="room-button" data-room="outside">Outside</button>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

  <script>
    const container = document.getElementById('container');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x000000);
    container.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(
      60,
      container.clientWidth / container.clientHeight,
      0.1,
      100
    );
    camera.position.set(0, 2, 6);

    let currentScene;
    const scenes = {};

    function createRoomScene(colorHex) {
      const scene = new THREE.Scene();

      const ambient = new THREE.AmbientLight(0xffffff, 0.35);
      scene.add(ambient);

      const dir = new THREE.DirectionalLight(0xffffff, 1.0);
      dir.position.set(3, 5, 2);
      scene.add(dir);

      const floorGeo = new THREE.PlaneGeometry(10, 10);
      const floorMat = new THREE.MeshStandardMaterial({ color: colorHex });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0;
      scene.add(floor);

      const wallGeo = new THREE.PlaneGeometry(10, 5);
      const wallMat = new THREE.MeshStandardMaterial({ color: colorHex, side: THREE.BackSide });

      const backWall = new THREE.Mesh(wallGeo, wallMat);
      backWall.position.set(0, 2.5, -5);
      scene.add(backWall);

      return scene;
    }

    function createBedroomScene() {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050509);

      const ambient = new THREE.AmbientLight(0xffffff, 0.35);
      scene.add(ambient);

      const moonLight = new THREE.DirectionalLight(0xffffff, 1.2);
      moonLight.position.set(-3, 5, 2);
      scene.add(moonLight);

      const glowGeo = new THREE.PlaneGeometry(3, 4);
      const glowMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.25
      });
      const glow = new THREE.Mesh(glowGeo, glowMat);
      glow.rotation.x = -Math.PI / 2;
      glow.position.set(-1.5, 0.01, -1);
      scene.add(glow);

      const floorGeo = new THREE.PlaneGeometry(10, 10);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x202020 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0;
      scene.add(floor);

      const wallMat = new THREE.MeshStandardMaterial({ color: 0x181820 });
      const wallGeo = new THREE.PlaneGeometry(10, 5);

      const backWall = new THREE.Mesh(wallGeo, wallMat);
      backWall.position.set(0, 2.5, -5);
      scene.add(backWall);

      const leftWall = new THREE.Mesh(wallGeo, wallMat);
      leftWall.rotation.y = Math.PI / 2;
      leftWall.position.set(-5, 2.5, 0);
      scene.add(leftWall);

      const rightWall = new THREE.Mesh(wallGeo, wallMat);
      rightWall.rotation.y = -Math.PI / 2;
      rightWall.position.set(5, 2.5, 0);
      scene.add(rightWall);

      const windowGeo = new THREE.PlaneGeometry(3, 2);
      const windowMat = new THREE.MeshBasicMaterial({ color: 0x101020 });
      const windowMesh = new THREE.Mesh(windowGeo, windowMat);
      windowMesh.position.set(-1.5, 3.2, -4.99);
      scene.add(windowMesh);

      const beamGeo = new THREE.PlaneGeometry(3, 4);
      const beamMat = new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.18
      });
      const beam = new THREE.Mesh(beamGeo, beamMat);
      beam.rotation.x = -Math.PI / 2;
      beam.position.set(-1.5, 0.02, -1);
      scene.add(beam);

      const mattressGeo = new THREE.BoxGeometry(3, 0.3, 1.6);
      const mattressMat = new THREE.MeshStandardMaterial({ color: 0xcfcfcf });
      const mattress = new THREE.Mesh(mattressGeo, mattressMat);
      mattress.position.set(0, 0.15, 0);
      scene.add(mattress);

      const blanketGeo = new THREE.BoxGeometry(2.2, 0.2, 0.8);
      const blanketMat = new THREE.MeshStandardMaterial({ color: 0x303060 });
      const blanket = new THREE.Mesh(blanketGeo, blanketMat);
      blanket.position.set(0.2, 0.35, 0.4);
      scene.add(blanket);

      const stevie = new THREE.Group();

      const bodyGeo = new THREE.BoxGeometry(0.6, 0.9, 0.4);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x334488 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.set(0, 0.9, 0);
      stevie.add(body);

      const headGeo = new THREE.SphereGeometry(0.32, 16, 16);
      const headMat = new THREE.MeshStandardMaterial({ color: 0xffd2b3 });
      const head = new THREE.Mesh(headGeo, headMat);
      head.position.set(0, 1.55, 0.05);
      stevie.add(head);

      const hairMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

      function addHair(x, y, z, sx, sy, sz) {
        const geo = new THREE.BoxGeometry(sx, sy, sz);
        const mesh = new THREE.Mesh(geo, hairMat);
        mesh.position.set(x, y, z);
        stevie.add(mesh);
      }

      addHair(0, 1.75, 0, 0.7, 0.25, 0.6);
      addHair(-0.25, 1.72, 0.1, 0.25, 0.25, 0.25);
      addHair(0.25, 1.72, 0.1, 0.25, 0.25, 0.25);
      addHair(0, 1.70, 0.25, 0.3, 0.25, 0.25);
      addHair(-0.15, 1.78, -0.1, 0.25, 0.25, 0.25);
      addHair(0.15, 1.78, -0.1, 0.25, 0.25, 0.25);

      const legMat = new THREE.MeshStandardMaterial({ color: 0x334488 });
      const upperLegGeo = new THREE.CylinderGeometry(0.12, 0.12, 0.5, 8);
      const lowerLegGeo = new THREE.CylinderGeometry(0.11, 0.11, 0.4, 8);

      const leftUpperLeg = new THREE.Mesh(upperLegGeo, legMat);
      leftUpperLeg.rotation.x = Math.PI / 2.2;
      leftUpperLeg.position.set(-0.18, 0.7, 0.15);
      stevie.add(leftUpperLeg);

      const leftLowerLeg = new THREE.Mesh(lowerLegGeo, legMat);
      leftLowerLeg.rotation.x = Math.PI / 2.2;
      leftLowerLeg.position.set(-0.18, 0.9, 0.45);
      stevie.add(leftLowerLeg);

      const rightUpperLeg = new THREE.Mesh(upperLegGeo, legMat);
      rightUpperLeg.rotation.x = Math.PI / 2.2;
      rightUpperLeg.position.set(0.18, 0.7, 0.15);
      stevie.add(rightUpperLeg);

      const rightLowerLeg = new THREE.Mesh(lowerLegGeo, legMat);
      rightLowerLeg.rotation.x = Math.PI / 2.2;
      rightLowerLeg.position.set(0.18, 0.9, 0.45);
      stevie.add(rightLowerLeg);

      const armMat = new THREE.MeshStandardMaterial({ color: 0xffd2b3 });
      const armGeo = new THREE.CylinderGeometry(0.09, 0.09, 0.6, 8);

      const leftArm = new THREE.Mesh(armGeo, armMat);
      leftArm.rotation.z = Math.PI / 2.8;
      leftArm.position.set(-0.25, 1.0, 0.35);
      stevie.add(leftArm);

      const rightArm = new THREE.Mesh(armGeo, armMat);
      rightArm.rotation.z = -Math.PI / 2.8;
      rightArm.position.set(0.25, 1.0, 0.35);
      stevie.add(rightArm);

      const glassMat = new THREE.MeshStandardMaterial({ color: 0x222222 });
      const frameGeo = new THREE.BoxGeometry(0.3, 0.18, 0.02);

      const leftFrame = new THREE.Mesh(frameGeo, glassMat);
      leftFrame.position.set(-0.17, 1.55, 0.32);
      stevie.add(leftFrame);

      const rightFrame = new THREE.Mesh(frameGeo, glassMat);
      rightFrame.position.set(0.17, 1.55, 0.32);
      stevie.add(rightFrame);

      const bridgeGeo = new THREE.BoxGeometry(0.1, 0.05, 0.02);
      const bridge = new THREE.Mesh(bridgeGeo, glassMat);
      bridge.position.set(0, 1.55, 0.32);
      stevie.add(bridge);

      const crackMat = new THREE.MeshBasicMaterial({ color: 0x88aaff });
      const crack1 = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.18, 0.01), crackMat);
      crack1.position.set(0.17, 1.55, 0.34);
      stevie.add(crack1);

      const crack2 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.02, 0.01), crackMat);
      crack2.position.set(0.17, 1.58, 0.34);
      stevie.add(crack2);

      const eyeGeo = new THREE.SphereGeometry(0.03, 8, 8);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const pupilGeo = new THREE.SphereGeometry(0.015, 8, 8);
      const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });

      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.12, 1.57, 0.33);
      stevie.add(leftEye);

      const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
      rightEye.position.set(0.12, 1.57, 0.33);
      stevie.add(rightEye);

      const leftPupil = new THREE.Mesh(pupilGeo, pupilMat);
      leftPupil.position.set(-0.12, 1.57, 0.36);
      stevie.add(leftPupil);

      const rightPupil = new THREE.Mesh(pupilGeo, pupilMat);
      rightPupil.position.set(0.12, 1.57, 0.36);
      stevie.add(rightPupil);

      const browMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const browGeo = new THREE.BoxGeometry(0.15, 0.02, 0.01);

      const leftBrow = new THREE.Mesh(browGeo, browMat);
      leftBrow.position.set(-0.12, 1.62, 0.33);
      leftBrow.rotation.z = 0.2;
      stevie.add(leftBrow);

      const rightBrow = new THREE.Mesh(browGeo, browMat);
      rightBrow.position.set(0.12, 1.62, 0.33);
      rightBrow.rotation.z = -0.2;
      stevie.add(rightBrow);

      const mouthGeo = new THREE.BoxGeometry(0.12, 0.03, 0.01);
      const mouthMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const mouth = new THREE.Mesh(mouthGeo, mouthMat);
      mouth.position.set(0, 1.48, 0.33);
      stevie.add(mouth);

      stevie.position.set(0, 0.15, 0);
      stevie.rotation.x = -0.15;

      scene.add(stevie);

      camera.position.set(0, 2.2, 4.5);
      camera.lookAt(0, 1.0, 0.2);

      return scene;
    }

    scenes.bedroom = createBedroomScene();
    scenes.hallway = createRoomScene(0x181818);
    scenes.kitchen = createRoomScene(0x303020);
    scenes.bathroom = createRoomScene(0x202840);
    scenes.living = createRoomScene(0x282020);
    scenes.basement = createRoomScene(0x101010);
    scenes.attic = createRoomScene(0x201820);
    scenes.outside = createRoomScene(0x003322);

    currentScene = scenes.bedroom;

    const buttons = document.querySelectorAll('.room-button');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const room = btn.getAttribute('data-room');

        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        if (scenes[room]) {
          currentScene = scenes[room];

          if (room === 'bedroom') {
            camera.position.set(0, 2.2, 4.5);
            camera.lookAt(0, 1.0, 0.2);
          } else {
            camera.position.set(0, 2, 6);
            camera.lookAt(0, 1, 0);
          }
        }
      });
    });

    window.addEventListener('resize', () => {
      const w = container.clientWidth;
      const h = container.clientHeight;
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    });

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(currentScene, camera);
    }

    animate();
  </script>
</body>
</html>
