<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stevie's Not Alone –</title>
<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
  }

  /* Layout */
  #game {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  #roomView {
    flex: 1;
    position: relative;
    background: radial-gradient(circle at center, #222 0%, #050505 60%, #000 100%);
    overflow: hidden;
  }

  /* Placeholder realistic dark room look */
  .room-bg {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    filter: brightness(0.4) contrast(1.2);
  }

  /* You can later replace these with real images */
  .room-bedroom    { background-image: linear-gradient(to bottom, #111 0%, #000 60%); }
  .room-hallway    { background-image: linear-gradient(to bottom, #050505 0%, #000 80%); }
  .room-kitchen    { background-image: linear-gradient(to bottom, #151515 0%, #000 80%); }
  .room-living     { background-image: linear-gradient(to bottom, #101010 0%, #000 80%); }
  .room-bathroom   { background-image: linear-gradient(to bottom, #202020 0%, #000 80%); }
  .room-upstairs   { background-image: linear-gradient(to bottom, #080808 0%, #000 80%); }
  .room-downstairs { background-image: linear-gradient(to bottom, #030303 0%, #000 80%); }

  /* Demon silhouette */
  #demon {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 260px;
    background: radial-gradient(circle at top, #300 0%, #000 60%);
    border-radius: 60px;
    box-shadow: 0 0 40px rgba(255,0,0,0.4);
    display: none;
  }
  #demon::before {
    content: "";
    position: absolute;
    top: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: #000;
  }
  #demon::after {
    content: "";
    position: absolute;
    top: 65px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 20px;
    border-radius: 10px;
    background: #fff;
  }
  .demon-eyes {
    position: absolute;
    top: 70px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #f00;
    box-shadow: 0 0 10px #f00;
  }
  .demon-eye-left  { left: calc(50% - 22px); }
  .demon-eye-right { left: calc(50% + 6px); }

  /* Hand overlay */
  #hand {
    position: absolute;
    bottom: 20px;
    right: 40px;
    width: 120px;
    height: 80px;
    border-radius: 40px;
    background: #f0c8a0;
    box-shadow: 0 0 20px rgba(0,0,0,0.7);
    opacity: 0.9;
  }

  /* UI */
  #ui-dialog {
    position: fixed;
    top: 5%;
    left: 50%;
    transform: translateX(-50%);
    max-width: 70%;
    padding: 10px 14px;
    background: rgba(20,20,20,0.8);
    border-radius: 8px;
    font-size: 15px;
    z-index: 5;
  }

  #hint {
    position: fixed;
    bottom: 5%;
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 12px;
    background: rgba(255,255,255,0.08);
    border-radius: 6px;
    font-size: 13px;
    z-index: 5;
  }

  #sceneLabel {
    position: fixed;
    top: 10px;
    left: 10px;
    font-size: 13px;
    opacity: 0.7;
    z-index: 5;
  }

  #skinSelector {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 5;
    background: rgba(0,0,0,0.6);
    padding: 10px 12px;
    border-radius: 6px;
    font-size: 14px;
  }
  #skinSelector button {
    margin: 4px;
    padding: 10px 14px;
    font-size: 14px;
    cursor: pointer;
    border-radius: 6px;
    border: none;
  }

  /* Navigation */
  #nav {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 10px;
    background: #050505;
    border-top: 1px solid #111;
  }
  #nav button {
    padding: 10px 16px;
    font-size: 14px;
    cursor: pointer;
    border-radius: 6px;
    border: none;
    background: #222;
    color: #fff;
  }
  #nav button:hover {
    background: #333;
  }

  /* Jumpscare overlay */
  #jumpscare {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, #700 0%, #000 70%);
    display: none;
    justify-content: center;
    align-items: center;
    font-size: 40px;
    color: #fff;
    z-index: 20;
  }
</style>
</head>
<body>
<div id="game">
  <div id="roomView">
    <div id="roomBg" class="room-bg room-bedroom"></div>
    <div id="demon">
      <div class="demon-eyes demon-eye-left"></div>
      <div class="demon-eyes demon-eye-right"></div>
    </div>
    <div id="hand"></div>
  </div>
  <div id="nav">
    <button data-target="hallway">Go to Hallway</button>
    <button data-target="kitchen">Go to Kitchen</button>
    <button data-target="living">Go to Living Room</button>
    <button data-target="bathroomDoor">Go to Bathroom Door</button>
    <button data-target="upstairs">Go Upstairs</button>
    <button data-target="downstairs">Go Downstairs</button>
    <button data-target="bedroom">Back to Bedroom</button>
  </div>
</div>

<div id="ui-dialog">STEVIE: Oh, the power's out again. I could fix the generators... Or just go back to sleep.</div>
<div id="hint">Click the buttons below to move around the house. Click rooms carefully...</div>
<div id="sceneLabel">Scene: Stevie's room</div>

<div id="skinSelector">
  Hand skin tone:
  <button data-skin="#f0c8a0">Light</button>
  <button data-skin="#d29b6c">Medium</button>
  <button data-skin="#8b5a2b">Dark</button>
</div>

<div id="jumpscare">JUMPSCARE</div>

<script>
  const dialog = document.getElementById('ui-dialog');
  const hint = document.getElementById('hint');
  const sceneLabel = document.getElementById('sceneLabel');
  const roomBg = document.getElementById('roomBg');
  const demonEl = document.getElementById('demon');
  const jumpscareEl = document.getElementById('jumpscare');
  const handEl = document.getElementById('hand');
  const navButtons = document.querySelectorAll('#nav button');
  const skinButtons = document.querySelectorAll('#skinSelector button');

  let currentScene = 'bedroom';
  let powerOn = false;
  let hasKey = false;
  let demonActive = false;
  let demonVisible = false;

  const sceneClasses = {
    bedroom: 'room-bedroom',
    hallway: 'room-hallway',
    kitchen: 'room-kitchen',
    living: 'room-living',
    bathroomDoor: 'room-bathroom',
    upstairs: 'room-upstairs',
    downstairs: 'room-downstairs',
    bathroom: 'room-bathroom'
  };

  function setScene(scene) {
    currentScene = scene;
    roomBg.className = 'room-bg ' + (sceneClasses[scene] || 'room-bedroom');

    sceneLabel.textContent = 'Scene: ' + (
      scene === 'bedroom'      ? "Stevie's room" :
      scene === 'hallway'      ? "Hallway" :
      scene === 'kitchen'      ? "Kitchen" :
      scene === 'living'       ? "Living room" :
      scene === 'bathroomDoor' ? "Bathroom door" :
      scene === 'bathroom'     ? "Bathroom" :
      scene === 'upstairs'     ? "Upstairs landing" :
      scene === 'downstairs'   ? "Downstairs landing" :
      scene
    );

    demonEl.style.display = 'none';
    demonVisible = false;

    if (demonActive) {
      maybeSpawnDemon();
    }

    updateDialogueForScene();
  }

  function updateDialogueForScene() {
    if (currentScene === 'bedroom') {
      if (!powerOn) {
        dialog.textContent = "STEVIE: Oh, the power's out again. I could fix the generators... Or just go back to sleep.";
        hint.textContent = "Click around the room. Maybe there's a switch.";
      } else {
        dialog.textContent = "STEVIE: My room... I don’t feel safe anymore.";
        hint.textContent = "You can explore the hallway, kitchen, living room, and more.";
      }
    } else if (currentScene === 'hallway') {
      dialog.textContent = "STEVIE: The hallway feels wrong tonight.";
      hint.textContent = "Click other rooms or go back to the bedroom.";
    } else if (currentScene === 'kitchen') {
      if (!hasKey) {
        dialog.textContent = "STEVIE: The kitchen... maybe there's something useful here.";
        hint.textContent = "Click again to check under the dining table.";
      } else {
        dialog.textContent = "STEVIE: I already grabbed the key from here.";
        hint.textContent = "You can go to the bathroom door now.";
      }
    } else if (currentScene === 'living') {
      dialog.textContent = "STEVIE: The living room is too quiet.";
      hint.textContent = "Silence is never good.";
    } else if (currentScene === 'bathroomDoor') {
      if (!hasKey) {
        dialog.textContent = "STEVIE: Why the hell would they lock the bathroom from outside!? I need a key.";
        hint.textContent = "Maybe check the kitchen again.";
      } else {
        dialog.textContent = "STEVIE: Got it. Bathroom's open.";
        hint.textContent = "Click again to enter the bathroom.";
      }
    } else if (currentScene === 'bathroom') {
      dialog.textContent = "STEVIE: Finally. The bathroom.";
      hint.textContent = "You don't feel alone in here.";
    } else if (currentScene === 'upstairs') {
      dialog.textContent = "STEVIE: Upstairs landing... Parents' room is up here.";
      hint.textContent = "You really shouldn't go into their room.";
    } else if (currentScene === 'downstairs') {
      dialog.textContent = "STEVIE: Downstairs... The basement door is here.";
      hint.textContent = "You are absolutely not going down there.";
    }
  }

  function maybeSpawnDemon() {
    const chance = Math.random();
    if (chance < 0.4) {
      demonVisible = true;
      demonEl.style.display = 'block';
    }
  }

  function triggerJumpscare() {
    jumpscareEl.style.display = 'flex';
    dialog.textContent = "STEVIE: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA—";
    hint.textContent = "You shouldn't have clicked that.";
    setTimeout(() => {
      jumpscareEl.style.display = 'none';
      setScene('bedroom');
    }, 1500);
  }

  navButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.target;

      if (target === 'bedroom') {
        setScene('bedroom');
        return;
      }

      if (target === 'kitchen') {
        if (currentScene === 'kitchen' && !hasKey) {
          hasKey = true;
          dialog.textContent = "STEVIE: A key...? Under the dining table?";
          hint.textContent = "Bathroom door might be open now.";
        }
        setScene('kitchen');
        return;
      }

      if (target === 'bathroomDoor') {
        setScene('bathroomDoor');
        if (hasKey) {
          dialog.textContent = "STEVIE: Got it. Bathroom's open.";
          hint.textContent = "Click Bathroom Door again to enter.";
        }
        return;
      }

      if (target === 'upstairs') {
        setScene('upstairs');
        return;
      }

      if (target === 'downstairs') {
        setScene('downstairs');
        return;
      }

      if (target === 'living') {
        setScene('living');
        return;
      }

      if (target === 'hallway') {
        setScene('hallway');
        return;
      }
    });
  });

  roomBg.addEventListener('click', () => {
    if (currentScene === 'bedroom' && !powerOn) {
      powerOn = true;
      demonActive = true;
      dialog.textContent = "STEVIE: That should fix the generators... I guess.";
      hint.textContent = "You should probably check the rest of the house.";
      return;
    }

    if (currentScene === 'bathroomDoor' && hasKey) {
      setScene('bathroom');
      return;
    }

    if (demonVisible) {
      triggerJumpscare();
    }
  });

  skinButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const color = btn.dataset.skin;
      handEl.style.background = color;
    });
  });

  setScene('bedroom');
</script>
</body>
</html>
