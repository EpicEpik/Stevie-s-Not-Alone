<!DOCTYPE html>
<html>
<head>
    <title>Stevie's Not Alone</title>
    <style>

        /* FULLSCREEN */
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background: black;
            font-family: Arial, sans-serif;
            color: white;
        }

        /* 3D CAMERA */
        #world {
            width: 100vw;
            height: 100vh;
            perspective: 900px;
            overflow: hidden;
            position: relative;
        }

        #camera {
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform: translateZ(0px);
            transition: transform 0.2s linear;
        }

        /* 3D HALLWAY */
        .wall {
            position: absolute;
            width: 800px;
            height: 800px;
            background: #5c432a; /* brown backrooms wall */
            border: 3px solid #3a2a1a;
            opacity: 0.95;
        }

        /* Floor + ceiling */
        #floor, #ceiling {
            position: absolute;
            width: 800px;
            height: 800px;
            background: #4a3824;
        }

        #floor {
            transform: rotateX(90deg) translateZ(400px);
        }

        #ceiling {
            transform: rotateX(-90deg) translateZ(400px);
        }

        /* Left + right walls */
        #left-wall {
            transform: rotateY(90deg) translateZ(400px);
        }

        #right-wall {
            transform: rotateY(-90deg) translateZ(400px);
        }

        /* Front wall (where demon appears) */
        #front-wall {
            transform: translateZ(-800px);
        }

        /* TITLE + BEDROOM SCREENS */
        #title-screen, #bedroom {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            padding-top: 10%;
            background: rgba(0,0,0,0.8);
        }

        /* BIG PLAY BUTTON */
        #play-btn {
            padding: 20px 40px;
            font-size: 28px;
            margin-top: 20px;
            cursor: pointer;
        }

        /* HAND BUTTONS */
        #hand-options {
            margin: 20px;
        }

        .hand {
            padding: 12px 25px;
            margin: 5px;
            font-size: 20px;
            cursor: pointer;
        }

        /* HAND ANIMATION */
        #hand-anim {
            display: none;
            position: absolute;
            bottom: -200px;
            right: 20px;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            transition: bottom 0.4s ease;
        }

        .hand-up {
            bottom: 20px;
        }

        /* DEMON EYES */
        #eyes {
            display: none;
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translateX(-50%) translateZ(-700px);
            font-size: 80px;
            color: red;
            letter-spacing: 40px;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .tilt {
            transform: translateX(-50%) translateZ(-700px) rotate(20deg);
        }

        /* SCREEN SHAKE */
        .shake {
            animation: shake 0.5s;
        }

        @keyframes shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(10px, -10px); }
            50% { transform: translate(-10px, 10px); }
            75% { transform: translate(10px, 10px); }
            100% { transform: translate(0, 0); }
        }

        .hint {
            opacity: 0.6;
            font-size: 14px;
        }

    </style>
</head>
<body>

    <!-- 3D WORLD -->
    <div id="world">
        <div id="camera">

            <div id="floor" class="wall"></div>
            <div id="ceiling" class="wall"></div>
            <div id="left-wall" class="wall"></div>
            <div id="right-wall" class="wall"></div>
            <div id="front-wall" class="wall"></div>

            <div id="eyes">● ●</div>

        </div>
    </div>

    <!-- TITLE SCREEN -->
    <div id="title-screen">
        <h1>Stevie's Not Alone</h1>

        <p>Select your hand:</p>
        <div id="hand-options">
            <button class="hand" data-hand="black">Black Hand</button>
            <button class="hand" data-hand="tan">Tan Hand</button>
            <button class="hand" data-hand="white">White Hand</button>
        </div>

        <button id="play-btn" style="display:none;">Play</button>
    </div>

    <!-- BEDROOM SCENE -->
    <div id="bedroom" style="display:none;">
        <p id="dialogue"></p>
        <p id="hint" class="hint">Press E to toggle the light switch.</p>
    </div>

    <!-- HAND ANIMATION -->
    <div id="hand-anim"></div>

    <script>

        let chosenHand = null;
        let inBedroom = false;
        let lightTried = false;
        let zPos = 0;

        /* HAND SELECTION */
        document.querySelectorAll(".hand").forEach(btn => {
            btn.addEventListener("click", () => {
                chosenHand = btn.dataset.hand;

                const hand = document.getElementById("hand-anim");
                if (chosenHand === "black") hand.style.background = "#3b2f2f";
                if (chosenHand === "tan") hand.style.background = "#d2a679";
                if (chosenHand === "white") hand.style.background = "#f2d6c9";

                document.getElementById("play-btn").style.display = "block";
            });
        });

        /* START GAME */
        document.getElementById("play-btn").addEventListener("click", () => {
            document.getElementById("title-screen").style.display = "none";
            document.getElementById("bedroom").style.display = "block";
            inBedroom = true;

            document.getElementById("dialogue").innerText =
                "STEVIE: Mother? Father? I had a nightmare...";
        });

        /* MOVEMENT (W KEY) */
        document.addEventListener("keydown", (e) => {
            if (e.key === "w" || e.key === "W") {
                zPos -= 20;
                document.getElementById("camera").style.transform =
                    `translateZ(${zPos}px)`;
            }
        });

        /* LIGHT SWITCH EVENT */
        document.addEventListener("keydown", (e) => {
            if (!inBedroom) return;

            if (e.key === "e" || e.key === "E") {

                const hand = document.getElementById("hand-anim");
                hand.style.display = "block";
                hand.classList.add("hand-up");

                setTimeout(() => {
                    hand.classList.remove("hand-up");
                }, 400);

                if (!lightTried) {
                    lightTried = true;

                    document.getElementById("dialogue").innerText =
                        "STEVIE: Oh, the power's out again. I could fix the generators... Or just go back to sleep.";

                    document.getElementById("hint").style.display = "none";

                    showChoices();
                }
            }
        });

        /* CHOICE BUTTONS */
        function showChoices() {
            const choice1 = document.createElement("button");
            const choice2 = document.createElement("button");

            choice1.innerText = "Fix generators";
            choice2.innerText = "Go back to sleep";

            choice1.style.margin = "10px";
            choice2.style.margin = "10px";

            choice1.onclick = () => alert("Generator path coming soon!");
            choice2.onclick = () => jumpscare();

            document.getElementById("bedroom").appendChild(choice1);
            document.getElementById("bedroom").appendChild(choice2);
        }

        /* DEMON JUMPSCARE */
        function jumpscare() {
            const eyes = document.getElementById("eyes");

            eyes.style.display = "block";
            eyes.style.opacity = "1";

            document.body.classList.add("shake");

            setTimeout(() => {
                eyes.classList.add("tilt");
            }, 500);

            setTimeout(() => {
                document.body.style.backgroundColor = "black";
                document.getElementById("bedroom").style.display = "none";
            }, 1500);
        }

    </script>

</body>
</html>
